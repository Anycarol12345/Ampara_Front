server {
  listen 8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  # Verificação de saúde do container
  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  # Configuração em tempo de execução: o navegador sempre revalida
  location = /config.js {
    expires -1;
  }

  # Arquivos com hash no nome: cache longo. Inexistente é 404 (não devolve o index.html)
  location /assets/ {
    try_files $uri =404;
    expires 1y;
  }

  # index.html sempre revalidado, para o navegador pegar o deploy novo
  location = /index.html {
    expires -1;
  }

  # Fallback da SPA: qualquer rota desconhecida entrega o index.html
  location / {
    try_files $uri $uri/ /index.html;
  }
}